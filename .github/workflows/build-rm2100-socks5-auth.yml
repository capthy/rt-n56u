name: Build RM2100 SOCKS5 Auth

on:
  push:
    branches:
      - fix/socks5-auth
    paths:
      - '.github/workflows/build-rm2100-socks5-auth.yml'

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 120

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install build dependencies
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            unzip libtool-bin curl cmake gperf gawk flex bison nano xxd fakeroot \
            cpio git python3-docutils gettext automake autopoint texinfo build-essential \
            help2man pkg-config zlib1g-dev libgmp-dev libmpc-dev libmpfr-dev \
            libncurses5-dev libltdl-dev wget file rsync
          if ! command -v python >/dev/null 2>&1; then
            sudo ln -s /usr/bin/python3 /usr/local/bin/python
          fi

      - name: Download MIPS toolchain
        run: |
          cd toolchain-mipsel
          sh dl_toolchain.sh

      - name: Prepare Go 1.15.2 archive
        run: |
          mkdir -p trunk/tools/go
          curl -fL https://go.dev/dl/go1.15.2.linux-amd64.tar.gz \
            -o trunk/tools/go/go1.15.2.linux-amd64.tar.gz
          echo "b49fda1ca29a1946d6bb2a5a6982cf07ccd2aba849289508ee0f9918f6bb4552  trunk/tools/go/go1.15.2.linux-amd64.tar.gz" | sha256sum -c -

      - name: Build RM2100 firmware
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p /tmp/firmware
          cwd="$(pwd)"
          CONFIG_TOOLCHAIN_DIR="${cwd//\//\\/}\/toolchain-mipsel"
          cd trunk

          cp -f configs/templates/RM2100.config .config

          sed -i '/CONFIG_FIRMWARE_INCLUDE_MENTOHUST/d' .config
          sed -i '/CONFIG_FIRMWARE_INCLUDE_SOFTETHERVPN_SERVER/d' .config
          sed -i '/CONFIG_FIRMWARE_INCLUDE_SOFTETHERVPN_CLIENT/d' .config
          sed -i '/CONFIG_FIRMWARE_INCLUDE_SOFTETHERVPN_CMD/d' .config
          sed -i '/CONFIG_FIRMWARE_INCLUDE_SCUTCLIENT/d' .config
          sed -i '/CONFIG_FIRMWARE_INCLUDE_SHADOWSOCKS/d' .config
          sed -i '/CONFIG_FIRMWARE_INCLUDE_SSSERVER/d' .config
          sed -i '/CONFIG_FIRMWARE_INCLUDE_DNSFORWARDER/d' .config
          sed -i '/CONFIG_FIRMWARE_INCLUDE_ADBYBY/d' .config
          sed -i '/CONFIG_FIRMWARE_INCLUDE_FRPC/d' .config
          sed -i '/CONFIG_FIRMWARE_INCLUDE_FRPS/d' .config
          sed -i '/CONFIG_FIRMWARE_INCLUDE_TUNSAFE/d' .config
          sed -i '/CONFIG_FIRMWARE_INCLUDE_ALIDDNS/d' .config
          sed -i '/CONFIG_FIRMWARE_INCLUDE_SMARTDNS/d' .config
          sed -i '/CONFIG_FIRMWARE_INCLUDE_SRELAY/d' .config

          echo "CONFIG_FIRMWARE_INCLUDE_SHADOWSOCKS=y" >> .config
          echo "CONFIG_FIRMWARE_INCLUDE_V2RAY=y" >> .config
          echo "CONFIG_FIRMWARE_INCLUDE_TROJAN=y" >> .config
          echo "CONFIG_FIRMWARE_INCLUDE_KUMASOCKS=y" >> .config
          echo "CONFIG_FIRMWARE_INCLUDE_ADBYBY=y" >> .config
          echo "CONFIG_FIRMWARE_INCLUDE_KOOLPROXY=y" >> .config
          echo "CONFIG_FIRMWARE_INCLUDE_SMARTDNS=y" >> .config
          echo "CONFIG_FIRMWARE_INCLUDE_ADGUARDHOME=y" >> .config
          echo "CONFIG_FIRMWARE_INCLUDE_CADDY=n" >> .config
          echo "CONFIG_FIRMWARE_INCLUDE_CADDYBIN=n" >> .config
          echo "CONFIG_FIRMWARE_INCLUDE_WYY=y" >> .config
          echo "CONFIG_FIRMWARE_INCLUDE_WYYBIN=y" >> .config
          echo "CONFIG_FIRMWARE_INCLUDE_ZEROTIER=y" >> .config
          echo "CONFIG_FIRMWARE_INCLUDE_ALIDDNS=y" >> .config

          sed -i "s/^CONFIG_TOOLCHAIN_DIR=.*$/CONFIG_TOOLCHAIN_DIR=${CONFIG_TOOLCHAIN_DIR}/g" .config

          sudo ./clear_tree_simple
          sudo ./build_firmware_modify RM2100 0

          cp -f images/*.trx /tmp/firmware/
          cd /tmp/firmware
          sha256sum *.trx > SHA256SUMS.txt
          ls -lh

      - name: Upload RM2100 firmware
        uses: actions/upload-artifact@v4
        with:
          name: RM2100-SOCKS5-Auth
          path: /tmp/firmware/*
          if-no-files-found: error
